<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 갤러리</title>
<!--
  예전 공유 링크(jayunsu22.github.io/autoblog/gallery.html?code=...) 를 위한 이사 안내 페이지.

  갤러리 실물은 songil.netlify.app/g/<코드> (songil 저장소의 photo_gallery.html) 로 옮겼다.
  github.io 는 정적 호스팅이라 서버에서 og 태그를 못 바꿔서, 카톡 미리보기 카드 제목이
  현장명 없이 늘 "사진 갤러리"로만 떴기 때문이다. 이미 카톡으로 보낸 링크가 살아 있어야
  하므로 지우지 않고, 받은 코드와 필터를 그대로 넘겨 새 주소로 보낸다.
-->
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        background: #f8fafc;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        padding: 20px;
    }
    a { color: #1d4ed8; }
</style>
</head>
<body>
    <div id="message">사진 갤러리로 이동하는 중...</div>
<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (!code) {
        document.getElementById('message').textContent = '잘못된 링크입니다. 링크를 다시 확인해 주세요.';
        return;
    }
    const next = new URLSearchParams();
    // 시공사진/밑작업 사진 체크 상태도 그대로 들고 간다 (없으면 새 페이지 기본값)
    const types = params.get('types');
    if (types) next.set('types', types);
    const query = next.toString();
    const url = `https://songil.netlify.app/g/${encodeURIComponent(code)}${query ? `?${query}` : ''}`;
    document.getElementById('message').innerHTML =
        `사진 갤러리로 이동하는 중...<br><br><a href="${url}">바로 열기</a>`;
    window.location.replace(url);
})();
</script>
</body>
</html>
