<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 품질 관리 시스템</title>
<!--
  예전 기사님 접속 링크(jayunsu22.github.io/autoblog/index.html?code=...) 를 위한 이사 안내 페이지.

  앱 실물은 songil.netlify.app/w/<코드> (songil 저장소의 worker/ 폴더) 로 옮겼다.
  github.io 는 정적 호스팅이라 서버에서 og 태그를 못 바꿔서, 카톡 미리보기 카드 제목이
  현장명 없이 늘 "현장 품질 관리 시스템"으로만 떠서 어느 현장 링크인지 알 수 없었기 때문이다.
  이미 카톡으로 보낸 링크와 홈화면에 추가해 둔 아이콘이 살아 있어야 하므로 지우지 않고,
  받은 코드를 그대로 넘겨 새 주소로 보낸다. (사진 갤러리 gallery.html 과 같은 방식)
-->
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        background: #f8fafc;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        padding: 20px;
    }
    a { color: #1d4ed8; }
</style>
</head>
<body>
    <div id="message">현장 품질관리 앱으로 이동하는 중...</div>
<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (!code) {
        document.getElementById('message').textContent = '잘못된 링크입니다. 사장님이 보내주신 카카오톡 링크를 다시 확인해 주세요.';
        return;
    }
    const url = `https://songil.netlify.app/w/${encodeURIComponent(code)}`;
    document.getElementById('message').innerHTML =
        `현장 품질관리 앱으로 이동하는 중...<br><br><a href="${url}">바로 열기</a>`;
    window.location.replace(url);
})();
</script>
</body>
</html>
